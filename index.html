<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>每日资讯</title>
<meta name="author" content="Aurora Xu">
<meta name="copyright" content="© 2026 Aurora Xu. All rights reserved.">
<link rel="stylesheet" href="fonts/fonts.css">
<style>
body{margin:0}
a{color:inherit;text-decoration-color:#C7C7CC;text-underline-offset:3px}a:hover{color:#C8102E}
.ev,.evband,.cb{position:absolute;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;text-align:left}
.ev{top:10px;height:258px;width:20px;transform:translateX(-50%)}
.ev::before{content:"";position:absolute;left:50%;top:8px;bottom:0;width:1px;margin-left:-0.5px;background:#C7C7CC}
.ev::after{content:"";position:absolute;left:50%;top:0;width:8px;height:8px;margin-left:-5.5px;border-radius:50%;background:#FFFFFF;border:1.5px solid #1D1D1F}
.ev:hover::before,.ev:focus::before{width:2px;margin-left:-1px;background:#1D1D1F}
.evband{top:28px;height:240px}
.ci{position:relative;height:294px}
.ev.lft .tip{left:auto;right:22px}
.ev.fut::before,.ev.fut:hover::before,.ev.fut:focus::before{background:none;width:0;margin-left:-0.5px;border-left:1px dashed #8E8E93}
.ev.fut::after{border:1.5px dashed #8E8E93}
*{scrollbar-width:thin;scrollbar-color:#D2D2D7 transparent}
*::-webkit-scrollbar{height:6px;width:6px}
*::-webkit-scrollbar-thumb{background:#D2D2D7;border-radius:3px}
*::-webkit-scrollbar-track{background:transparent}
.tk{position:absolute;top:274px;font-size:11px;color:#6E6E73;transform:translateX(-50%);white-space:nowrap}
.cb{aspect-ratio:1;border-radius:50%;border:2px solid #FFFFFF;transform:translate(-50%,-50%);box-sizing:border-box}
.cb .tip{top:calc(100% + 8px);left:50%;transform:translateX(-50%);width:250px}
.cb.r .tip{left:auto;right:-10px;transform:none}
.cb.up .tip{top:auto;bottom:calc(100% + 8px)}
.cb:hover,.cb:focus{z-index:20;outline:none;box-shadow:0 0 0 2px #1D1D1F}
.cb:hover .tip,.cb:focus .tip{display:block}
.tip{display:none;position:absolute;z-index:5;background:#FFFFFF;border-radius:14px;box-shadow:0 2px 6px rgba(0,0,0,0.08),0 16px 40px rgba(0,0,0,0.14);padding:14px 16px;color:#1D1D1F;font-size:13px;line-height:1.6;font-weight:400}
.ev .tip{top:0;left:22px;width:310px}
.evband .tip{top:0;right:calc(100% + 10px);width:250px}
.ev:hover,.ev:focus,.evband:hover,.evband:focus,.bub:hover,.bub:focus{z-index:20;outline:none}
.ev:hover .tip,.ev:focus .tip,.evband:hover .tip,.evband:focus .tip,.bub:hover .tip,.bub:focus .tip{display:block}
.bub{position:relative;display:flex;align-items:center;justify-content:center;height:56px;background:none;border:none;padding:0;cursor:pointer;font-family:inherit;border-radius:10px}
.bub:hover,.bub:focus{background:#F5F5F7}
.bub .tip{bottom:calc(100% - 4px);white-space:nowrap;padding:10px 14px}
.bub.l .tip{left:0}.bub.c .tip{left:50%;transform:translateX(-50%)}.bub.r .tip{right:0}
.pill{display:inline-block;font-size:11px;font-weight:500;padding:1px 8px;border-radius:6px;white-space:nowrap}

.lnk{background:none;border:none;padding:0;margin:0;font-family:inherit;font-size:13px;color:#1D1D1F;cursor:pointer;display:inline-flex;align-items:center;gap:6px;min-height:32px;text-decoration:underline;text-decoration-color:#C7C7CC;text-underline-offset:4px}
.lnk:hover{color:#C8102E}
.rowbtn{transition:background .12s}
.rowbtn:hover{background:#FAFAFB !important}
.nd .tip{bottom:calc(100% + 2px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:8px 12px;font-size:12px}
.nd:hover,.nd:focus{z-index:20;outline:none}
.nd:hover .tip,.nd:focus .tip{display:block}
.dbar:hover>span:first-child{background:#F5F5F7 !important}
.pscroll::-webkit-scrollbar{width:6px}.pscroll::-webkit-scrollbar-thumb{background:#C7C7CC;border-radius:3px}.pscroll{scrollbar-width:thin;scrollbar-color:#C7C7CC transparent}
.crow{display:grid;grid-template-columns:14px 118px minmax(150px,1fr) 96px 104px minmax(0,2.3fr);column-gap:16px;align-items:center}
.wrow{display:grid;grid-template-columns:14px minmax(0,1fr) 170px 150px 96px;column-gap:16px;align-items:center}
.crow [data-l]::before,.wrow [data-l]::before{display:none}
.gn{transition:left .4s ease,top .4s ease,width .4s ease,opacity .3s ease}
@keyframes gfade{from{opacity:0}to{opacity:1}}
.ge{animation:gfade .5s ease}
@media (max-width:860px){
.crow{grid-template-columns:14px minmax(0,1fr) auto auto;row-gap:8px;column-gap:12px}
.crow .c-vol,.crow .c-dyn{grid-column:2/-1}
.wrow{grid-template-columns:14px minmax(0,1fr) minmax(0,1fr);row-gap:6px;column-gap:12px}
.wrow .w-title,.wrow .w-first{grid-column:2/-1}
.wrow .w-tr{grid-column:2}
.chead,.whead{display:none !important}
.crow [data-l]::before,.wrow [data-l]::before{display:inline;content:attr(data-l);color:#6E6E73;font-size:11px;font-weight:400;margin-right:6px}
}

.wrow{display:grid;grid-template-columns:minmax(0,1fr) 170px 150px 96px 14px;column-gap:16px;align-items:center}
.frow{display:grid;grid-template-columns:104px minmax(0,1fr) 78px 60px 84px;column-gap:14px;align-items:center}
.prow{display:grid;grid-template-columns:minmax(0,1fr) 44px 80px 40px 76px;column-gap:14px;align-items:center}
.scr{overflow-y:auto;scrollbar-width:auto;scrollbar-color:auto}
@supports not selector(::-webkit-scrollbar){.scr{scrollbar-width:thin;scrollbar-color:#C7C7CC transparent}}
.scr::-webkit-scrollbar{width:6px}
.scr::-webkit-scrollbar-track{background:transparent}
.scr::-webkit-scrollbar-thumb{background:#D2D2D7;border-radius:3px}
.scr:hover::-webkit-scrollbar-thumb{background:#AEAEB2}
.chip{transition:opacity .25s ease}
.chip:hover,.chip:focus{z-index:20;outline:none}
.chip .tip{bottom:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;padding:8px 12px;font-size:12px;font-weight:400}
.chip:hover .tip,.chip:focus .tip{display:block}
.gring{position:absolute;border:1px solid #F0F0F3;border-radius:50%;box-sizing:border-box;pointer-events:none}
.obtn{min-height:32px;padding:0 12px;border:none;border-radius:16px;background:#FFFFFF;box-shadow:inset 0 0 0 1px #C7C7CC;color:#1D1D1F;font-family:inherit;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.obtn:hover{box-shadow:inset 0 0 0 1px #1D1D1F}
@media (max-width:860px){
.prow{grid-template-columns:auto auto auto minmax(0,1fr);column-gap:8px;row-gap:5px}
.prow .p-title{grid-column:1/-1}
.phead{display:none !important}
.wrow{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 14px;row-gap:6px;column-gap:12px}
.wrow .w-title{grid-column:1/3}
.wrow .w-first{grid-column:1/-1}
.wrow [data-l]{grid-column:1/3;white-space:normal !important}
.wdl{flex-direction:column;gap:2px !important}
.wdl-k{width:auto !important;font-size:12px}
.wind{padding-left:0 !important}
.wind2{margin-left:0 !important}
.parr{display:none}
.csrc{margin-left:0 !important}
.mhead{padding:20px 16px !important}
.mtog{order:2}
.msub{order:3;flex-basis:100%}
section[style*="padding: 26px 28px"]{padding:22px 16px !important}
aside[aria-label^="研判"]{padding:18px 16px !important}
.wrow.rowbtn{padding:12px 8px !important}
div[aria-hidden="true"][style*="margin: 0 16px"]{margin:0 8px !important}
div[style*="padding: 2px 16px 18px"]{padding:2px 8px 16px !important}
.seg button{padding:9px 12px !important}
.gscr{overflow-x:auto;margin:0 -12px;padding:0 12px}
.gbox{min-width:600px;align-self:flex-start !important}
.ghint{display:block !important;position:sticky;left:0}
.pnode{grid-template-columns:minmax(0,1fr) !important}
.wrow .w-chev{grid-column:3;grid-row:1}
.frow{grid-template-columns:100px minmax(0,1fr) 76px;column-gap:10px}
.frow .f-ns,.frow .f-en{display:none}
}

.mbar{flex:1 1 0;min-width:0;display:flex;align-items:flex-end;justify-content:center;height:100%}
.noeng .f-en{display:none}
@media (min-width: 721px){.noeng .frow{grid-template-columns:104px minmax(0,1fr) 60px 84px}}
.seg{display:inline-flex;flex-wrap:wrap;padding:3px;background:#E8E8ED;border-radius:9px;gap:2px}
.seg button{border:none;font-family:inherit;font-size:13px;line-height:1.4;padding:5px 12px;border-radius:6px;cursor:pointer;white-space:nowrap}
.seg button[disabled]{cursor:not-allowed;opacity:.45}
.menu{position:absolute;left:-8px;top:calc(100% + 8px);z-index:30;min-width:240px;background:#FFFFFF;border-radius:14px;box-shadow:0 12px 40px rgba(0,0,0,.14),0 0 0 1px rgba(0,0,0,.06);padding:6px;display:flex;flex-direction:column}
.menu button{display:flex;justify-content:space-between;gap:16px;align-items:baseline;border:none;background:none;font-family:inherit;font-size:14px;color:#1D1D1F;text-align:left;padding:9px 12px;border-radius:9px;cursor:pointer}
.menu button:hover{background:#F5F5F7}
.menu button[disabled]{cursor:default;color:#6E6E73}
.ovl{position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.32);display:flex;align-items:flex-start;justify-content:center;padding:6vh 16px 24px;overflow:auto}
.dlg{width:100%;max-width:520px;box-sizing:border-box;background:#FFFFFF;border-radius:20px;box-shadow:0 24px 80px rgba(0,0,0,.25);padding:26px 28px;display:flex;flex-direction:column;gap:16px;font-size:14px;line-height:1.6;color:#1D1D1F}
.dlg h2{margin:0;font-size:19px;font-weight:600;letter-spacing:-0.01em}
.dlg label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:#6E6E73}
.dlg input{font-family:inherit;font-size:14px;color:#1D1D1F;padding:9px 12px;border:none;border-radius:10px;background:#F5F5F7;box-shadow:inset 0 0 0 1px #E1E1E6;outline:none;min-width:0}
.dlg input:focus{box-shadow:inset 0 0 0 1.5px #1D1D1F}
.dlg .row{display:flex;flex-wrap:wrap;gap:10px;justify-content:flex-end;align-items:center}
.pbtn{min-height:36px;padding:0 18px;border:none;border-radius:18px;background:#1D1D1F;color:#FFFFFF;font-family:inherit;font-size:13.5px;font-weight:500;cursor:pointer}
.pbtn[disabled]{opacity:.5;cursor:default}
.chipx{display:inline-flex;align-items:center;gap:8px;padding:5px 6px 5px 12px;border-radius:16px;background:#F5F5F7;font-size:13px}
.chipx button{width:20px;height:20px;border:none;border-radius:50%;background:#E1E1E6;color:#1D1D1F;font-size:12px;line-height:1;cursor:pointer;padding:0}

</style>
</head>
<body>
<div style="font-family: 'Inter', 'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', system-ui, sans-serif; color: #1D1D1F; background: #F5F5F7; min-height: 100vh; line-height: 1.6">
<main id="root" style="max-width: 1240px; margin: 0 auto; padding: 32px clamp(16px, 4vw, 48px) 40px; display: flex; flex-direction: column; gap: 20px"></main>
</div>
<script type="text/plain" id="tmpl">

<header style="display: flex; flex-wrap: wrap; gap: 16px 24px; align-items: center; justify-content: space-between">
<div style="display: flex; flex-direction: column; gap: 4px; min-width: 0">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px">
<div data-menu="1" style="position: relative">
<button type="button" onClick="{{ onSwitch }}" aria-haspopup="true" aria-expanded="{{ swX }}" aria-label="切换监测对象，当前为 {{ meta.brand }}" style="display: inline-flex; align-items: center; gap: 8px; border: none; background: none; padding: 0; margin: 0; font-family: inherit; color: #1D1D1F; cursor: pointer"><span style="font-size: 28px; font-weight: 600; letter-spacing: -0.015em">{{ meta.brand }}</span><span aria-hidden="true" style="display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 22px; border-radius: 50%; background: #E8E8ED; transform: {{ swRot }}"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 4.5L6 8l3.5-3.5" fill="none" stroke="#8E8E93" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path></svg></span></button>
<sc-if value="{{ swOpen }}"><div class="menu" onClick="{{ onPickTarget }}"><span style="font-size: 11px; letter-spacing: 0.1em; color: #6E6E73; padding: 6px 12px 4px">监测对象</span><sc-for list="{{ targets }}" as="t"><button type="button" data-target="{{ t.id }}" {{ t.dis }} style="font-weight: {{ t.w }}"><span>{{ t.name }}</span><span style="font-size: 12px; color: #6E6E73; font-weight: 400">{{ t.note }}</span></button></sc-for><span aria-hidden="true" style="height: 1px; background: #EDEDF0; margin: 6px 12px"></span><button type="button" data-new="1"><span>＋ 新建监测</span></button></div></sc-if>
</div>
<span style="font-size: 14px; color: #6E6E73">每日资讯</span>
</div>
<div style="font-size: 12px; color: #6E6E73">{{ meta.sub }}</div>
</div>
<div style="font-size: 12px; color: #6E6E73">数据更新于 {{ meta.updated }}</div>
</header>
<div style="display: flex; flex-wrap: wrap; gap: 10px 28px; align-items: center">
<div style="display: flex; align-items: center; gap: 10px"><span style="flex: none; white-space: nowrap; font-size: 12px; color: #6E6E73">时间范围</span><div class="seg" role="group" aria-label="时间范围" onClick="{{ onRange }}"><sc-for list="{{ ranges }}" as="r"><button type="button" data-range="{{ r.k }}" aria-pressed="{{ r.x }}" style="{{ r.css }}">{{ r.label }}</button></sc-for></div></div>
<div style="display: flex; align-items: center; gap: 10px"><span style="flex: none; white-space: nowrap; font-size: 12px; color: #6E6E73">平台</span><div class="seg" role="group" aria-label="平台" onClick="{{ onPlat }}"><sc-for list="{{ platBtns }}" as="b"><button type="button" data-plat="{{ b.k }}" aria-pressed="{{ b.x }}" {{ b.dis }} title="{{ b.tip }}" style="{{ b.css }}">{{ b.label }}</button></sc-for></div></div>
<span style="flex: 1 1 260px; font-size: 12px; color: #6E6E73">{{ filterNote }}</span>
</div>
<div style="display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; padding: 18px 4px 0"><span style="font-size: 12px; font-weight: 600; letter-spacing: 0.1em; color: #6E6E73">01</span><h2 style="margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.01em">舆情预警</h2><span style="font-size: 13px; color: #6E6E73">负面事件的监测与跟踪</span></div>
<section style="background: #FFFFFF; border-radius: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.04), 0 8px 24px rgba(0,0,0,0.04); box-sizing: border-box; min-width: 0; padding: 26px 28px; display: flex; flex-direction: column; gap: 22px"><sc-if value="{{ negSmall }}"><div style="display: flex; flex-wrap: wrap; gap: 24px 48px; align-items: center; justify-content: space-between">
<div style="flex: 1 1 320px; min-width: 0; display: flex; flex-direction: column; gap: 6px">
<h3 id="h-alert" style="margin: 0; font-size: 13px; font-weight: 500; color: #6E6E73">近 7 天有新增负面的事件</h3>
<div style="display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap"><span style="font-size: 64px; font-weight: 600; line-height: 1; letter-spacing: -0.03em; color: {{ kTodayColor }}">{{ shareBig }}</span><span style="font-size: 15px; color: #6E6E73">{{ shareCap }}</span></div>
<div style="font-size: 15px; line-height: 1.7; margin-top: 6px">{{{ heroNote }}}</div>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 14px 28px; margin-top: 14px; max-width: 640px"><sc-for list="{{ tiles }}" as="t"><div style="display: flex; flex-direction: column; gap: 2px; min-width: 0"><span style="font-size: 12px; color: #6E6E73">{{ t.label }}</span><span style="font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ t.value }}</span><span style="font-size: 12px; color: #6E6E73; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{ t.sub }}</span></div></sc-for></div>
</div>
<div role="button" tabindex="0" onClick="{{ onNegOpen }}" aria-label="放大查看每日负面条数" class="rowbtn" style="flex: 1 1 320px; min-width: 0; max-width: 460px; box-sizing: border-box; display: flex; flex-direction: column; gap: 8px; padding: 12px 14px; margin: -12px -14px; border: none; border-radius: 14px; background: none; font-family: inherit; color: #1D1D1F; text-align: left; cursor: zoom-in">
<span style="display: flex; gap: 10px; align-items: baseline; justify-content: space-between"><span style="font-size: 13px; font-weight: 500">每日负面条数</span><span style="display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: #6E6E73"><svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><path d="M7 1.5h3.5V5M5 10.5H1.5V7M10.5 1.5L6.8 5.2M1.5 10.5l3.7-3.7" fill="none" stroke="#6E6E73" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"></path></svg>放大看每天的数字</span></span>
<span style="display: flex; min-width: 0; padding-right: 12px">
<span aria-hidden="true" style="position: relative; flex: none; width: 26px; height: 96px"><span style="position: absolute; right: 6px; bottom: -6px; font-size: 11px; color: #6E6E73">0</span><span style="position: absolute; right: 6px; bottom: {{ miniThrLab }}; font-size: 11px; color: #6E6E73">{{ thr }}</span></span>
<span style="position: relative; flex: 1 1 0; min-width: 0; height: 96px; border-bottom: 1px solid #D2D2D7">
<span style="position: absolute; inset: 0; display: flex; gap: 2px"><sc-for list="{{ days }}" as="d"><span class="mbar" style="position: relative"><span style="position: absolute; bottom: 0; width: clamp(2px, 60%, 7px); height: {{ d.mh }}; background: {{ d.mc }}; border-radius: {{ d.r }}"></span><span style="position: absolute; bottom: 0; width: clamp(2px, 60%, 7px); height: {{ d.meh }}; background: #DB444B; border-radius: 2px 2px 0 0"></span></span></sc-for></span>
</span>
</span>
<span style="display: flex; justify-content: space-between; padding: 0 12px 0 26px; font-size: 11px; color: #6E6E73"><span>{{ day0 }}</span><span style="color: #1D1D1F; font-weight: 600">今日</span></span>
</div>
</div></sc-if><sc-if value="{{ negBig }}"><div style="display: flex; flex-direction: column; gap: 14px">
<div style="display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between">
<div style="display: flex; flex-wrap: wrap; gap: 4px 12px; align-items: baseline"><h3 style="margin: 0; font-size: 15px; font-weight: 600; letter-spacing: -0.005em">每日负面条数</h3><span style="font-size: 12px; color: #6E6E73">{{ ndLabel }}{{ totHint }} · 点击某一天看当天的负面内容</span><span style="display: inline-flex; gap: 12px; align-items: center; font-size: 12px; color: #6E6E73"><span style="display: inline-flex; gap: 5px; align-items: center"><i style="width: 8px; height: 8px; border-radius: 2px; background: #DB444B"></i>属于跟踪中的事件</span><span style="display: inline-flex; gap: 5px; align-items: center"><i style="width: 8px; height: 8px; border-radius: 2px; background: #F1B4BD"></i>零散负面</span></span></div>
<button type="button" class="lnk" onClick="{{ onNegClose }}">收起</button>
</div>
<div style="display: flex; min-width: 0">
<div aria-hidden="true" style="position: relative; flex: none; width: 30px; height: 244px"><sc-for list="{{ negTicks }}" as="y"><span style="position: absolute; right: 8px; bottom: {{ y.b }}; font-size: 11px; color: #6E6E73; font-variant-numeric: tabular-nums">{{ y.v }}</span></sc-for></div>
<div style="position: relative; flex: 1 1 0; min-width: 0; height: 244px">
<span aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 23px; height: 1px; background: #D2D2D7"></span>
<div onClick="{{ onDay }}" style="position: absolute; inset: 0; display: flex; gap: 2px"><sc-for list="{{ days }}" as="d"><button type="button" class="dbar" data-day="{{ d.i }}" aria-label="{{ d.aria }}" style="flex: 1 1 0; min-width: 0; height: 244px; position: relative; padding: 0; margin: 0; border: none; background: transparent; font-family: inherit; cursor: pointer"><span style="position: absolute; left: 0; right: 0; top: 0; bottom: 24px; border-radius: 6px 6px 0 0; background: {{ d.bg }}"></span><span style="position: absolute; left: 50%; bottom: {{ d.vb }}; transform: translateX(-50%); font-size: 12px; font-weight: 600; color: #1D1D1F">{{ d.val }}</span><span style="position: absolute; left: 50%; bottom: 24px; width: min(56%, 16px); height: {{ d.eh }}; transform: translateX(-50%); background: #DB444B; border-radius: {{ d.er }}"></span><span style="position: absolute; left: 50%; bottom: {{ d.sb }}; width: min(56%, 16px); height: {{ d.sh }}; transform: translateX(-50%); background: #F1B4BD; border-radius: 3px 3px 0 0"></span><span style="position: absolute; left: 50%; bottom: 3px; transform: translateX(-50%); font-size: 11px; white-space: nowrap; color: {{ d.labColor }}; font-weight: {{ d.labWeight }}">{{ d.lab }}</span></button></sc-for></div>
</div>

<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 280px), 1fr)); gap: 18px 36px">
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">声量</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">去重后提到监测对象的内容条数。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">同口径声量</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">竞品对比用。每家都只按公司名称搜，每个平台每次只取前 10 条，新闻全取；监测对象多抓的部分和评论不计入。条数反映的是近期新内容出现得多快，比较相对高低，不是全网总量。净情感度、条均互动也按这个样本算。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">负面占比</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">负面条数 ÷ 全部条数；评论区负面集中的帖子也算负面。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">评论</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">微博、抖音每条取前 20 条热评，小红书取页面显示的热评；只用来判断帖子的评论区倾向，不计入声量。评论只在采集时读取，重点帖子会定期回访。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">每日负面条数</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">红色是属于跟踪事件的负面，浅红是零散负面。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">走势</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">近 7 天负面条数与前 7 天比：多 50% 且多 3 条以上为上升，少三分之一且少 3 条以上为回落，其余平稳。近两周条数太少时，看这件事自己的高峰：高峰时一周 5 条以上、现在不到三分之一为回落，从没多过为零星。出现不满 7 天的事件标“新出现”，走势按它出现以来的前后两半比较；近 3 天急升显示“升温快”。社媒持续采集不满两周时，前后比较只算新闻；只有社媒内容的事件标“数据积累中”。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">事件</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">有明确起因的一件具体的事，由模型归类，可展开核对；没有具体起因的算零散负面。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">扩大迹象</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">升温（近 3 天日均达到此前 14 天的 3 倍）、跨平台（同一件事近 7 天 5 条以上、2 个平台以上）、高互动（前 5%）、评论区负面集中、涉及产品安全。除产品安全外，都要求至少有一条内容的互动量达到社媒中位数。按议题归拢的零散负面不是同一件事，不看跨平台和评论区。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">被大量收藏</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">小红书、抖音的负面内容收藏不少于 50、且达到点赞的一半，多是避雷类内容，热度过后仍会影响购买。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">事件等级</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">关注＝没有扩大迹象；二级＝出现任一迹象；一级＝涉及产品安全且已升温或跨平台。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">传播路径</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">“谁先提的”指采集到的最早一条；先后顺序不代表谁影响了谁；热度判断不了有没有水军。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">近 7 天变化</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">议题近 7 天声量与此前 7 天相比。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">关联强度</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">两个议题被同一条内容同时提到的条数，越多连线越粗。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">代表性内容</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">按互动量、转载量、来源类型和相关度综合排序，每个议题取前 5 条。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">净情感度</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">（正面 − 负面）÷（正面 + 负面），取值 −1 到 +1。</div></div>
<div style="display: flex; flex-direction: column; gap: 3px"><div style="font-size: 13px; font-weight: 600">条均互动</div><div style="font-size: 13px; line-height: 1.7; color: #6E6E73">社媒内容的点赞、评论、转发之和 ÷ 条数。</div></div>
</div>

'<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;align-items:end"><label>公司名称<input name="name" placeholder="例如：三只松鼠"></label><label>品类（可选）<input name="cat" placeholder="例如：休闲零食"></label><label>关键词（可选）<input name="kw" placeholder="逗号分隔"></label></div>' +
'<div><button type="button" class="obtn" data-add>＋ 加入名单</button></div>' + CODE_FIELD +
'<div data-msg style="font-size:13px;min-height:20px"></div><div class="row"><button type="button" class="lnk" data-del style="font-size:12px;margin-right:auto">停止监测「' + esc(D.meta.brand) + '」</button><button type="button" class="obtn" data-x>取消</button><button type="button" class="pbtn" data-ok>保存</button></div>');
o.querySelector('[name=code]').value = CODE;
function draw() { o.querySelector('[data-list]').innerHTML = list.length ? list.map(function (c, i) { return '<span class="chipx">' + esc(c.name) + (c.category ? '<span style="color:' + SEC + ';font-size:12px">' + esc(c.category) + '</span>' : '') + '<button type="button" data-rm="' + i + '" aria-label="移除 ' + esc(c.name) + '">×</button></span>'; }).join('') : '<span style="color:' + SEC + ';font-size:13px">名单为空。</span>'; }
draw();
o.querySelector('[data-list]').onclick = function (ev) { var v = pick(ev, 'data-rm'); if (v != null) { list.splice(parseInt(v, 10), 1); draw(); } };
function addOne() { var n = o.querySelector('[name=name]'), name = n.value.trim(); if (!name) return false; if (name === D.meta.brand || list.some(function (c) { return c.name === name; })) { say(o, false, '「' + name + '」已经在名单里。'); return false; }
list.push({ name: name, category: o.querySelector('[name=cat]').value.trim(), keywords: words(o.querySelector('[name=kw]').value) }); n.value = ''; o.querySelector('[name=kw]').value = ''; say(o, true, ''); draw(); return true; }
o.querySelector('[data-add]').onclick = addOne;
o.querySelector('[data-x]').onclick = function () { o.remove(); };
function send(body, okText, btn) { CODE = o.querySelector('[name=code]').value; if (!CODE) return say(o, false, '请填写管理口令。'); body.code = CODE; body.target = D.meta.brand; btn.disabled = true; say(o, true, '正在保存……');
api(body, function (r) { btn.disabled = false; say(o, r.ok, r.ok ? okText : (r.message || '保存失败。')); if (r.ok) { var b = o.querySelector('[data-ok]'); b.textContent = '完成'; b.onclick = function () { o.remove(); }; } }); }
o.querySelector('[data-ok]').onclick = function () { addOne(); send({ action: 'set_comps', comps: list }, '已保存竞品名单。' + WAIT, this); };
o.querySelector('[data-del]').onclick = function () { if (this.getAttribute('data-sure')) send({ action: 'del_target' }, '已停止监测「' + D.meta.brand + '」。下次更新后它会从切换菜单里消失。', this); else { this.setAttribute('data-sure', '1'); this.textContent = '再点一次确认：停止监测「' + D.meta.brand + '」'; } };
}
document.addEventListener('click', function (ev) { if (state.sw && !(ev.target.closest && ev.target.closest('[data-menu]'))) setState({ sw: false }); });
if (!SETS.order.length) { root.innerHTML = '<div style="padding:60px 0;text-align:center;color:' + SEC + '">还没有生成数据。请等待自动更新完成后刷新页面。</div>'; return; }
var saved = null; try { saved = localStorage.getItem('monitor'); } catch (e) {}
use((location.hash && decodeURIComponent(location.hash.slice(1))) || saved || SETS.order[0]);
render();
})();

document.addEventListener('keydown', function (e) { var t = e.target; if ((e.key === 'Enter' || e.key === ' ') && t && t.getAttribute && t.getAttribute('role') === 'button' && t.tagName !== 'BUTTON') { e.preventDefault(); t.click(); } });

</script>
</body>
</html>
